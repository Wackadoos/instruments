; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -std=gnu++17 -O2
build_unflags = -std=gnu++11 -Os
monitor_speed = 9600
lib_deps =
	git@github.com:SolidGeek/VescUart.git
	git@github.com:PaulStoffregen/XPT2046_Touchscreen.git
	git@github.com:bolderflight/invensense-imu.git
	adafruit/RTClib@^2.1.4
	adafruit/Adafruit AHTX0@^2.0.6
	adafruit/Adafruit BMP280 Library@^3.0.0
	milesburton/DallasTemperature@^4.0.6
	slashdevin/NeoGPS@^4.2.9
	greiman/SdFat@^2.3.1
	paulstoffregen/OneWire@^2.3.8
	paulstoffregen/TimerOne@^1.2
	sparkfun/SparkFun External EEPROM Arduino Library@^3.2.13
